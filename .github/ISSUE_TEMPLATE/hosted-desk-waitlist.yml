name: Hosted desk waitlist
description: Join the waitlist for the hosted UW → desk (alerts + filters + optional live place)
title: "Waitlist: hosted desk"
labels: ["waitlist"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for interest in the **hosted desk** (~$49/mo founding target).
        Free repo stays free. This list is for people who want it run for them.
  - type: input
    id: email
    attributes:
      label: Email
      description: Where we should notify you when seats open
      placeholder: you@example.com
    validations:
      required: true
  - type: input
    id: x_handle
    attributes:
      label: X handle (optional)
      placeholder: "@you"
  - type: dropdown
    id: path
    attributes:
      label: What do you want first?
      options:
        - Alerts into my agent (Grok Bot / Hermes / Claw)
        - Live place on Robinhood Agentic
        - Live place on IBKR / other broker
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: uw
    attributes:
      label: Do you already have Unusual Whales?
      options:
        - Yes
        - Not yet (I'll use the partner link)
        - Prefer not to say
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      placeholder: Stack, account size band, timeline…
